name: CI
# 默认只在手动触发时运行（Actions 页面 → CI → Run workflow），不随 push / PR 自动跑。
# 如果要恢复「每次 push 自动验证」，把下面两行注释去掉即可：
#   push:
#   pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:templates
      - run: pnpm test:mcp
      - run: pnpm build
